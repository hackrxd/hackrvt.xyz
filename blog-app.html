<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>blog | hackrVT</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #100c16;
      --panel: #1a1424;
      --border: #2e2440;
      --text: #eae4f2;
      --muted: #9c90b0;
      --violet: #b18aff;
      --peach: #ffb46b;
    }
    body {
      font-family: 'Atkinson Hyperlegible', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.5rem 1.25rem 4rem;
      max-width: 42rem;
      margin: 0 auto;
      line-height: 1.7;
      font-size: 1.0625rem;
    }
    ::selection { background: var(--violet); color: var(--bg); }
    a {
      color: var(--violet);
      text-decoration: underline;
      text-decoration-color: rgba(177, 138, 255, 0.35);
      text-underline-offset: 3px;
    }
    a:hover { text-decoration-color: var(--violet); }
    :focus-visible { outline: 2px solid var(--peach); outline-offset: 2px; }
    nav {
      margin-bottom: 2.5rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px dashed var(--border);
      font-family: 'Silkscreen', monospace;
      font-size: 10px;
    }
    nav a { color: var(--muted); text-decoration: none; padding: 7px 10px 5px; border: 1px solid var(--border); }
    nav a:hover { color: var(--bg); background: var(--violet); border-color: var(--violet); }
    #app { min-height: 4rem; }

    /* List view */
    .blog-heading {
      font-family: 'Silkscreen', monospace;
      font-weight: 400;
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .blog-heading::after { content: "_"; color: var(--peach); animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .blog-heading::after { animation: none; } }
    .post-list { list-style: none; }
    .post-list li + li { border-top: 1px dashed var(--border); }
    .post-link { display: block; padding: 1rem 0; text-decoration: none; }
    .post-title { font-size: 1.0625rem; font-weight: bold; color: var(--text); }
    .post-desc { margin-top: 0.3rem; color: var(--muted); font-size: 0.875rem; }
    .post-date { margin-top: 0.25rem; color: var(--muted); font-size: 0.8rem; opacity: 0.7; }
    .post-link:hover .post-title { color: var(--violet); }

    /* Post view */
    .back-link {
      display: inline-block;
      margin-bottom: 2rem;
      font-family: 'Silkscreen', monospace;
      font-size: 10px;
      color: var(--muted);
      text-decoration: none;
    }
    .back-link:hover { color: var(--violet); }
    .post-content { line-height: 1.75; }
    .post-content h1, .post-content h2 { font-family: 'Silkscreen', monospace; font-weight: 400; line-height: 1.3; }
    .post-content h1 { font-size: 1.5rem; margin: 2rem 0 1rem; }
    .post-content h2 { font-size: 1rem; color: var(--violet); margin: 2rem 0 0.75rem; }
    .post-content h3 { font-size: 1.0625rem; margin: 1.5rem 0 0.5rem; }
    .post-content h3::before { content: "▸ "; color: var(--peach); }
    .post-content p { margin-bottom: 1rem; }
    .post-content strong { color: var(--peach); }
    .post-content ul, .post-content ol { padding-left: 1.5rem; margin-bottom: 1rem; }
    .post-content li { margin-bottom: 0.25rem; }
    .post-content li::marker { color: var(--peach); }
    .post-content pre { margin: 1.25rem 0; border-radius: 6px; overflow-x: auto; font-size: 0.875rem; }
    .post-content code { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace; }
    .post-content code:not(pre code) {
      background: var(--panel);
      padding: 0.15em 0.35em;
      border-radius: 3px;
      font-size: 0.875em;
    }
    .post-content blockquote {
      border-left: 3px solid var(--border);
      padding-left: 1rem;
      color: var(--muted);
      margin: 1rem 0;
    }
    .post-content a { color: var(--violet); }
    .post-content hr { border: none; border-top: 1px dashed var(--border); margin: 2rem 0; }
    .post-content img { max-width: 100%; }

    /* GFM alerts — > [!NOTE], [!TIP], [!IMPORTANT], [!WARNING], [!CAUTION] */
.gfm-alert {
  border-left: 3px solid;
  padding: 0.75rem 1rem;
  margin: 1.25rem 0;
  border-radius: 0 4px 4px 0;
  background: rgba(255, 255, 255, 0.03);
}
.gfm-alert-title {
  font-size: 0.75rem;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 0.5rem;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.gfm-alert-body > :last-child { margin-bottom: 0; }
.gfm-alert-note      { border-color: #3b82f6; }
.gfm-alert-note      .gfm-alert-title { color: #3b82f6; }
.gfm-alert-tip       { border-color: #22c55e; }
.gfm-alert-tip       .gfm-alert-title { color: #22c55e; }
.gfm-alert-important { border-color: #a855f7; }
.gfm-alert-important .gfm-alert-title { color: #a855f7; }
.gfm-alert-warning   { border-color: #f59e0b; }
.gfm-alert-warning   .gfm-alert-title { color: #f59e0b; }
.gfm-alert-caution   { border-color: #ef4444; }
.gfm-alert-caution   .gfm-alert-title { color: #ef4444; }

    /* States */
    .status { color: var(--muted); font-size: 0.875rem; margin-top: 1rem; }
    .error { color: #f87171; font-size: 0.875rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <nav><a href="/">← hackrVT</a></nav>
  <div id="app"><p class="status">Loading...</p></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script>
    const app = document.getElementById('app');
    const API = 'https://api.hackrvt.xyz';
    const FILES = 'https://files.hackrvt.xyz';

    // Client-side router
    function route() {
      const path = window.location.pathname.replace(/\/$/, '') || '/blog';
      const blogBase = '/blog';
      if (path === blogBase) {
        showList();
      } else if (path.startsWith(blogBase + '/')) {
        const id = path.slice(blogBase.length + 1);
        showPost(id);
      } else {
        console.warn('Unexpected path, falling back to list:', path);
        showList();
      }
    }

    function navigate(url) {
      try {
        const parsed = new URL(url, location.origin);
        if (parsed.origin !== location.origin) { location.href = url; return; }
        history.pushState({}, '', parsed.pathname + parsed.search + parsed.hash);
      } catch { location.href = url; return; }
      route();
    }

    // Delegate nav clicks to pushState
    document.addEventListener('click', e => {
      const link = e.target.closest('a[data-nav]');
      if (!link) return;
      e.preventDefault();
      navigate(link.getAttribute('href'));
    });

    window.addEventListener('popstate', route);
    document.addEventListener('DOMContentLoaded', route);

    // Escape user-provided strings before inserting into HTML
    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatDate(raw) {
      if (!raw) return '';
      const d = new Date(raw);
      if (isNaN(d)) return '';
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    async function showList() {
      app.innerHTML = '<p class="status">Loading posts...</p>';
      try {
        const res = await fetch(`${API}/blogs`);
        if (!res.ok) throw new Error(`${res.status}`);
        const data = await res.json();
        const posts = data.blogs ?? data;

        if (!Array.isArray(posts) || posts.length === 0) {
          app.innerHTML = '<h1 class="blog-heading">blog</h1><p class="status">No posts yet.</p>';
          return;
        }

        const items = posts.map(post => {
          const date = formatDate(post.date ?? post.created_at ?? post.published_at);
          return `<li>
            <a class="post-link" href="/blog/${esc(post.id)}" data-nav>
              <div class="post-title">${esc(post.title)}</div>
              ${post.description ? `<div class="post-desc">${esc(post.description)}</div>` : ''}
              ${date ? `<div class="post-date">${date}</div>` : ''}
            </a>
          </li>`;
        }).join('');

        app.innerHTML = `<h1 class="blog-heading">blog</h1><ul class="post-list">${items}</ul>`;
      } catch (err) {
        app.innerHTML = `<h1 class="blog-heading">blog</h1><p class="error">Couldn't load posts — try again later.</p>`;
        console.error('showList:', err);
      }
    }

    const ALERTS = {
  NOTE:      { label: 'Note',      icon: 'ℹ'  },
  TIP:       { label: 'Tip',       icon: '💡' },
  IMPORTANT: { label: 'Important', icon: '❗' },
  WARNING:   { label: 'Warning',   icon: '⚠'  },
  CAUTION:   { label: 'Caution',   icon: '🚫' },
};

function applyAlerts(html) {
  return html.replace(
    /<blockquote>\n?<p>\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\][ \t]?\n?([\s\S]*?)<\/p>([\s\S]*?)<\/blockquote>/gi,
    (_, type, firstPara, rest) => {
      const t = type.toUpperCase();
      const { label, icon } = ALERTS[t];
      const body = (firstPara.trim() ? `<p>${firstPara.trim()}</p>` : '') + rest;
      return `<div class="gfm-alert gfm-alert-${t.toLowerCase()}">` +
               `<div class="gfm-alert-title"><span>${icon}</span>${label}</div>` +
               `<div class="gfm-alert-body">${body}</div>` +
             `</div>`;
    }
  );
}

    async function showPost(id) {
      if (!/^[a-zA-Z0-9_-]+$/.test(id)) {
        app.innerHTML = `
          <a class="back-link" href="/blog" data-nav>← back</a>
          <p class="error">Couldn't load this post. It may not exist.</p>
        `;
        return;
      }
      app.innerHTML = '<p class="status">Loading...</p>';
      try {
        const res = await fetch(`${FILES}/blogs/${encodeURIComponent(id)}.md`);
        if (!res.ok) throw new Error(`${res.status}`);
        const md = await res.text();
        const html = DOMPurify.sanitize(applyAlerts(marked.parse(md)));
        app.innerHTML = `
          <a class="back-link" href="/blog" data-nav>← back</a>
          <div class="post-content">${html}</div>
        `;
        app.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
      } catch (err) {
        app.innerHTML = `
          <a class="back-link" href="/blog" data-nav>← back</a>
          <p class="error">Couldn't load this post. It may not exist.</p>
        `;
        console.error('showPost:', err);
      }
    }
  </script>
</body>
</html>
